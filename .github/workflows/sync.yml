# .github/workflows/sync.yml
on:
  push:
    branches: [main]

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add github https://x-access-token:$GITHUB_TOKEN@github.com/supreme-lab/SkillVetBench.git
          git push github main --force